
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prismatic AI - Workspace</title>

    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --glass: rgba(255,255,255,0.05);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }

        .sidebar h2 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .user-info {
            padding: 15px;
            background: var(--glass);
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-info span {
            color: #4ade80;
            font-weight: bold;
        }

        .agent-list {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.8;
        }

        .logout-btn {
            margin-top: auto;
            padding: 12px;
            background: #ef4444;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            background: var(--glass);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.6;
            font-size: 0.95rem;
            overflow-wrap: anywhere;
        }

        .user-msg {
            background: var(--primary);
            align-self: flex-end;
        }

        .ai-msg {
            background: rgba(255,255,255,0.08);
            align-self: flex-start;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .agent-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            font-weight: 800;
            display: block;
            margin-bottom: 5px;
        }

        .ai-img {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            margin-top: 10px;
            border: 2px solid var(--primary);
        }

        .input-area {
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 1rem;
            min-width: 0;
        }

        button#sendBtn {
            padding: 10px 25px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing {
            font-size: 0.8rem;
            color: #94a3b8;
            display: none;
            margin-bottom: 10px;
        }

        @media(max-width: 650px) {
            .sidebar {
                width: 145px;
                padding: 12px;
            }

            .sidebar h2 {
                font-size: 1.1rem;
            }

            .main-content {
                padding: 10px;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <h2>🤖 Prismatic</h2>

        <div class="user-info">
            Welcome back,<br>
            <span id="displayUser">User</span>
        </div>

        <div class="agent-list">
            <b>System Status:</b><br>
            ✍️ Writing Agent: Online<br>
            💻 Coding Agent: Online<br>
            🎨 Artist Agent: Online
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>

    <div class="main-content">

        <div class="chat-box" id="chatBox">

            <div class="message ai-msg">
                <span class="agent-badge">System</span>
                Hello! Prismatic AI is online.
                I can help you with coding, writing,
                or generating creative images.
            </div>

        </div>

        <div class="typing" id="typingIndicator">
            Prismatic is thinking...
        </div>

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Ask anything or Generate an image..."
            >

            <button id="sendBtn" onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script>

        // BACKEND CONFIGURATION
        const apiBase = "http://127.0.0.1:8001";

        const username = localStorage.getItem("username");
        const token = localStorage.getItem("token");

        const chatBox = document.getElementById("chatBox");
        const input = document.getElementById("userInput");
        const typing = document.getElementById("typingIndicator");
        const sendBtn = document.getElementById("sendBtn");

        // LOGIN CHECK
        if (!token || !username) {
            window.location.href = "/";
        }

        document.getElementById("displayUser").innerText =
            username || "User";

        // LOGOUT
        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("username");
            window.location.href = "/";
        }

        // SAFE TEXT MESSAGE
        function addMessage(content, className, agentName) {

            const message = document.createElement("div");
            message.className = "message " + className;

            if (agentName) {
                const badge = document.createElement("span");
                badge.className = "agent-badge";
                badge.innerText = agentName;
                message.appendChild(badge);
            }

            const text = document.createElement("div");
            text.style.whiteSpace = "pre-wrap";
            text.textContent = content || "";

            message.appendChild(text);
            chatBox.appendChild(message);

            chatBox.scrollTop = chatBox.scrollHeight;

            return message;
        }

        // SEND MESSAGE
        async function sendMessage() {

            const text = input.value.trim();

            if (!text || sendBtn.disabled) return;

            addMessage(text, "user-msg");

            input.value = "";

            typing.style.display = "block";
            sendBtn.disabled = true;

            try {

                const response = await fetch(
                    apiBase + "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            message: text,
                            username: username
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "AI service error"
                    );
                }

                const agent = data.agent_used
                    ? data.agent_used.toUpperCase()
                    : "GENERAL";

                const message = document.createElement("div");
                message.className = "message ai-msg";

                const badge = document.createElement("span");
                badge.className = "agent-badge";
                badge.innerText = "🤖 " + agent + " Agent";

                message.appendChild(badge);

                if (data.media_type === "image" && data.url) {

                    const image = document.createElement("img");

                    image.src = data.url;
                    image.alt = "Generated image";
                    image.className = "ai-img";
                    image.loading = "lazy";

                    image.addEventListener("click", () => {
                        window.open(
                            image.src,
                            "_blank",
                            "noopener,noreferrer"
                        );
                    });

                    message.appendChild(image);

                } else {

                    const reply = document.createElement("div");

                    reply.style.whiteSpace = "pre-wrap";
                    reply.textContent =
                        data.reply || "No response received.";

                    message.appendChild(reply);
                }

                chatBox.appendChild(message);

            } catch (error) {

                addMessage(
                    error.message || "Connection error. Check your backend.",
                    "ai-msg"
                );

                console.error("Prismatic AI error:", error);

            } finally {

                typing.style.display = "none";
                sendBtn.disabled = false;
                input.focus();

                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // ENTER TO SEND
        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }

        });

    </script>

</body>
</html>
