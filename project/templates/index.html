
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prismatic AI - Login</title>

    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #4338ca;
            border-radius: 50%;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: #be185d;
            border-radius: 50%;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2.5rem;
            border-radius: 1rem;
            width: 320px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: white;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-card">

        <h2 id="formTitle">System Login</h2>

        <form id="authForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="submitBtn">
                Login
            </button>

        </form>

        <div class="message" id="messageBox"></div>

        <div class="footer-links">
            <span id="toggleText">New user? </span>
            <a id="toggleBtn" href="#">Sign Up</a>
        </div>

    </div>

    <script>
        let isLoginMode = true;

        // Backend URL
        // Local development:
        const apiBase = "http://127.0.0.1:8001";

        const authForm = document.getElementById("authForm");
        const submitBtn = document.getElementById("submitBtn");
        const messageBox = document.getElementById("messageBox");

        function showMessage(message, type) {
            messageBox.innerText = message;
            messageBox.className = "message " + type;
        }

        function toggleMode() {

            isLoginMode = !isLoginMode;

            document.getElementById("formTitle").innerText =
                isLoginMode ? "System Login" : "Create Account";

            submitBtn.innerText =
                isLoginMode ? "Login" : "Sign Up";

            document.getElementById("toggleBtn").innerText =
                isLoginMode ? "Sign Up" : "Login";

            document.getElementById("toggleText").innerText =
                isLoginMode ? "New user? " : "Already have an account? ";

            document.getElementById("password").autocomplete =
                isLoginMode ? "current-password" : "new-password";

            messageBox.innerText = "";
            messageBox.className = "message";
        }

        document.getElementById("toggleBtn").addEventListener(
            "click",
            function(event) {
                event.preventDefault();
                toggleMode();
            }
        );

        authForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            messageBox.innerText = "";

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const endpoint = isLoginMode ? "/login" : "/signup";

            try {

                const response = await fetch(apiBase + endpoint, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Authentication failed");
                }

                if (isLoginMode) {

                    localStorage.setItem("token", data.token);
                    localStorage.setItem("username", data.username);

                    showMessage(
                        "Success! Redirecting...",
                        "success"
                    );

                    setTimeout(function() {
                        window.location.href = "/dashboard";
                    }, 1000);

                } else {

                    showMessage(
                        "Account Created! Now please Login.",
                        "success"
                    );

                    authForm.reset();

                    setTimeout(function() {
                        toggleMode();
                    }, 1500);

                }

            } catch (error) {

                showMessage(
                    error.message || "Server connection failed.",
                    "error"
                );

            } finally {

                submitBtn.disabled = false;

                submitBtn.innerText =
                    isLoginMode ? "Login" : "Sign Up";

            }

        });

    </script>

</body>
</html>
